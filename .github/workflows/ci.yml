name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and install PackTidy wheel with browser test dependency
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install playwright
          python -m pip install --no-deps dist/*.whl
          python -m playwright install --with-deps chromium
      - name: Run generated-board browser regression
        env:
          PACKTIDY_BROWSER_USE_INSTALLED: '1'
        run: python -B -m unittest discover -s tests -p test_browser_regression.py -v

  windows-cross-volume:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select a genuine second NTFS volume
        shell: pwsh
        run: |
          $workspaceDrive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          $second = Get-Volume | Where-Object {
            $_.DriveType -eq 'Fixed' -and $_.FileSystem -eq 'NTFS' -and $_.DriveLetter -and $_.DriveLetter -ne $workspaceDrive
          } | Select-Object -First 1
          if (-not $second) { throw "No separate fixed NTFS volume is available (workspace is on $workspaceDrive`:). Cross-volume acceptance cannot run safely." }
          $target = "$($second.DriveLetter):\"
          "PACKTIDY_TEST_CROSS_VOLUME_DIR=$target" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "Using existing NTFS volume $target; no volume is created or formatted."
      - name: Run real cross-volume NTFS acceptance tests
        run: python -B -m unittest discover -s tests -p test_cross_volume.py -v

  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -B -m unittest discover -s tests -v
      - name: Run decision baseline
        run: python -B packtidy.py verify run cases/baseline.json
      - name: Build wheel and inspect its layout
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -c "from pathlib import Path; from zipfile import ZipFile; w=next(Path('dist').glob('*.whl')); z=ZipFile(w); n=set(z.namelist()); required={'packtidy.py','core/__init__.py','core/signals.py','core/wire_ui.html','rules/__init__.py','rules/default.json'}; missing=required-n; print('wheel:', w); print('wheel entries:'); print('\n'.join(sorted(n))); assert not missing, f'missing wheel entries: {missing}'"
      - name: Install wheel and smoke test outside the checkout
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/packtidy-install" dist/*.whl
          mkdir -p "$RUNNER_TEMP/packtidy-smoke/input"
          printf 'smoke\n' > "$RUNNER_TEMP/packtidy-smoke/input/sample.txt"
          cd "$RUNNER_TEMP/packtidy-smoke"
          export PYTHONPATH="$RUNNER_TEMP/packtidy-install"
          python -m packtidy scan input --json
          python -m packtidy rules show
          python -m packtidy ui input --out board.html
          python -c "from pathlib import Path; s=Path('board.html').read_text(encoding='utf-8'); assert 'id=\"wires\"' in s and '__PACKTIDY_DATA__' not in s"

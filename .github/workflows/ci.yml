name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # 3.9 在 ubuntu-latest（已升到 26.04）上不再提供，最低用 3.10
  PY_MIN: '3.10'
  PY_MAX: '3.14'

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_MAX }}
      - name: Build and install PackTidy wheel with browser test dependency
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install playwright
          python -m pip install --no-deps dist/*.whl
          python -m playwright install --with-deps chromium
      - name: Run generated-board browser regression
        env:
          PACKTIDY_BROWSER_USE_INSTALLED: '1'
        run: python -B -m unittest discover -s tests -p test_browser_regression.py -v

  windows-cross-volume:
    # 这个 job 需要一块真实的第二个 NTFS 卷。
    # GitHub 托管的 windows-latest 只有 C:，所以必然找不到——
    # 之前每次都是红的。改成手动触发，找不到卷时明确跳过。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_MAX }}
      - name: Select a genuine second NTFS volume
        id: pick
        shell: pwsh
        run: |
          $workspaceDrive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          $second = Get-Volume | Where-Object {
            $_.DriveType -eq 'Fixed' -and $_.FileSystem -eq 'NTFS' -and
            $_.DriveLetter -and $_.DriveLetter -ne $workspaceDrive
          } | Select-Object -First 1
          if (-not $second) {
            Write-Host "::notice::workspace 在 ${workspaceDrive}:，没有第二块固定 NTFS 卷，跳过真实跨卷验收。"
            "found=0" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            exit 0
          }
          $target = "$($second.DriveLetter):\"
          "PACKTIDY_TEST_CROSS_VOLUME_DIR=$target" | Add-Content -LiteralPath $env:GITHUB_ENV
          "found=1" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "使用已有的 NTFS 卷 $target；不创建、不格式化任何卷。"
      - name: Run real cross-volume NTFS acceptance tests
        if: steps.pick.outputs.found == '1'
        run: python -B -m unittest discover -s tests -p test_cross_volume.py -v

  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -B -m unittest discover -s tests -v
      - name: Run decision baseline
        run: python -B packtidy.py verify run cases/baseline.json
      - name: Build wheel and inspect its layout
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -c "from pathlib import Path; from zipfile import ZipFile; w=next(Path('dist').glob('*.whl')); z=ZipFile(w); n=set(z.namelist()); required={'packtidy.py','core/__init__.py','core/signals.py','core/wire_ui.html','rules/__init__.py','rules/default.json'}; missing=required-n; print('wheel:', w); print('wheel entries:'); print(chr(10).join(sorted(n))); assert not missing, f'missing wheel entries: {missing}'"
      - name: Install wheel and smoke test outside the checkout
        # 用独立脚本而不是 -m：单文件模块没有 __main__.py，
        # 而 core/ 内部是扁平导入，必须由 packtidy.py 显式把 core/ 加进 sys.path。
        run: |
          python -c "
          import pathlib, sys, os, tempfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'packtidy-install'
          import subprocess
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', str(target), *map(str, pathlib.Path('dist').glob('*.whl'))])

          sys.path.insert(0, str(target))
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'packtidy-smoke'
          (work / 'input').mkdir(parents=True, exist_ok=True)
          (work / 'input' / 'sample.txt').write_text('smoke\n', encoding='utf-8')
          os.chdir(work)

          from packtidy import main
          assert main(['scan', 'input', '--json']) == 0
          assert main(['rules', 'show']) == 0
          assert main(['ui', 'input', '--out', 'board.html']) == 0

          html = pathlib.Path('board.html').read_text(encoding='utf-8')
          assert 'wires' in html, 'board.html 里没有连线元素'
          assert '__PACKTIDY_DATA__' not in html, '数据占位符没被替换'
          print('smoke OK: wheel 安装后 scan / rules / ui 都可用')
          "
